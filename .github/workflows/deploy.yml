name: Deploy CallPilot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: callpilot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Load public Firebase web configuration
        shell: bash
        run: |
          # Firebase web config is client-side configuration, not a service-account credential.
          # Keep the canonical values in .env.local.example; never put server secrets here.
          set -a
          source .env.local.example
          set +a
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID; do
            if [ -n "${!key}" ]; then
              echo "$key=${!key}" >> "$GITHUB_ENV"
            fi
          done

      - name: Validate production deployment identity
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for key in GCP_WORKLOAD_IDENTITY_PROVIDER FIREBASE_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!key}" ]; then
              echo "::error::Required GitHub Actions secret $key is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the two Workload Identity Federation values under Settings > Secrets and variables > Actions."
            exit 1
          fi
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Firebase web configuration value $key is missing from .env.local.example."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project vattams-f70cf --non-interactive
